name = "attune-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
LLM_PROVIDER = "openai"
REQUIRE_AUTH = "0"
ENFORCE_RATE_LIMIT = "1"
ALLOWED_ORIGINS = "https://chama18.github.io,https://qloo-api-1.web.app,http://localhost:3000,http://127.0.0.1:3000"
# LLM_MODEL = "gpt-4o-mini"

# Enable Firebase Email/Password and configure authorized frontend domains before deployment.
# Set QLOO_API_KEY with `wrangler secret put QLOO_API_KEY`.

# Approximate per-location rate limit. Use a namespace ID unique to this account.
[[ratelimits]]
name = "QLOO_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 60
period = 60
