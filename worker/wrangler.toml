name = "attune-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
LLM_PROVIDER = "openai"
# LLM_MODEL = "gpt-4o-mini"

# Firebase ID token verification (worker/src/auth.js). Leave REQUIRE_AUTH unset
# so the demo room stays anonymous; set it to "1" to require a Google/Apple
# session on every /api/** call.
# FIREBASE_PROJECT_ID = "qloo-api-1"
# REQUIRE_AUTH = "1"

# Secrets are set with `wrangler secret put`, never committed:
#   QLOO_API_KEY, LLM_API_KEY
