name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble clean site artifact
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git*' \
            --exclude '.verify/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'worker/' \
            --exclude '*.log' \
            --exclude '.env.example' \
            --exclude 'Caddyfile' \
            --exclude 'firebase.json' \
            --exclude '.firebaserc' \
            --exclude 'worklog.md' \
            --exclude 'dev-server.log' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            ./ dist/
          # Dev screenshots are not referenced by the app
          rm -f dist/preview-*.png "dist/image copy.png" "dist/image copy 2.png" dist/image.png
          echo "Artifact contents:"; du -sh dist; ls dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
