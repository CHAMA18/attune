name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application
        run: |
          npm ci
          node --test tests/qloo-audit.test.cjs
          npm test --prefix worker
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Assemble clean site artifact
        run: |
          mkdir -p site
          cp index.html landing.html site/
          cp -R assets audio logo site/
          touch site/.nojekyll
          node -e "require('fs').writeFileSync('site/build.json', JSON.stringify({revision: process.env.GITHUB_SHA, builtAt: new Date().toISOString()}))"
          du -sh site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
